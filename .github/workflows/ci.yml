name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,sync]"

      - name: Lint new and updated modules with Ruff
        run: |
          ruff check mcp_observatory/exporters/sync_bridge.py mcp_observatory/cli.py tests/test_sync_bridge_and_cli.py

      - name: Run pytest
        run: pytest -q
