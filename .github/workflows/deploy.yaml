name: Deploy to PyPI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: python -m pip install --upgrade build

      - name: Build distributions
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-observatory
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      # PyPI refuses to overwrite an existing file, so publishing on every push
      # to main meant any push that did not bump the version failed the whole
      # pipeline -- including pushes that changed no packaged code at all. The
      # version is checked first and the upload skipped when it is already
      # released, so "nothing new to publish" is a normal outcome rather than a
      # red build. A genuine upload failure still fails, because only the
      # already-released case is skipped.
      - name: Check whether this version is already on PyPI
        id: version-check
        run: |
          # Read the version off the artifact that is about to be uploaded
          # rather than off pyproject.toml: this job downloads dist/ and never
          # checks the repo out, and the built filename is the version that
          # will actually be published.
          WHEEL="$(ls dist/*.whl | head -n1)"
          VERSION="$(basename "${WHEEL}" | cut -d- -f2)"
          if [ -z "${VERSION}" ]; then
            echo "could not determine version from ${WHEEL}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if curl -sSfo /dev/null "https://pypi.org/pypi/mcp-observatory/${VERSION}/json"; then
            echo "mcp-observatory ${VERSION} is already on PyPI; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "mcp-observatory ${VERSION} is not on PyPI; publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package to PyPI
        if: steps.version-check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

  push-rag-artifacts:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_RAG_ARTIFACTS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Push md and puml files to S3
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          S3_PREFIX="s3://expertise-rag-artifacts-239571291755-prod/raw/${REPO_NAME}"
          find . -not -path './.git/*' \( -name '*.md' -o -name '*.puml' \) | while read -r file; do
            aws s3 cp "$file" "${S3_PREFIX}/${file#./}"
          done
