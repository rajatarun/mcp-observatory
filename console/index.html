<title>Weave Operations Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ── tokens: complete light palette on bare :root ───────────────────── */
:root{
  --ground:#F4F6F5; --surface:#FFFFFF; --surface-2:#EDF1F0; --line:#D7DEDC;
  --ink:#0E1A1F; --ink-2:#3D4F55; --ink-3:#6A7C81;
  --thread:#00819E; --thread-soft:#E2F0F3;
  --allow:#3E7D52; --review:#96670F; --block:#A8382F;
  --allow-bg:#E6F0E9; --review-bg:#F7EEDC; --block-bg:#F7E6E4;
  --c1:#00819E; --c2:#C85A24; --c3:#6E55AD; --c4:#5C8A33;
  --shadow:0 1px 2px rgba(14,26,31,.06), 0 8px 24px -16px rgba(14,26,31,.35);
  --r:10px;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#101D22; --surface:#17272E; --surface-2:#1E323A; --line:#2B424B;
  --ink:#E7EEEE; --ink-2:#AEC0C4; --ink-3:#7E9298;
  --thread:#1E96B0; --thread-soft:#15333C;
  --allow:#6FB98A; --review:#D9A23B; --block:#E4736A;
  --allow-bg:#16302354; --review-bg:#3A2D1080; --block-bg:#3A1C1980;
  --c1:#1E96B0; --c2:#D4753C; --c3:#8878C0; --c4:#72A043;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --ground:#101D22; --surface:#17272E; --surface-2:#1E323A; --line:#2B424B;
  --ink:#E7EEEE; --ink-2:#AEC0C4; --ink-3:#7E9298;
  --thread:#1E96B0; --thread-soft:#15333C;
  --allow:#6FB98A; --review:#D9A23B; --block:#E4736A;
  --allow-bg:#16302354; --review-bg:#3A2D1080; --block-bg:#3A1C1980;
  --c1:#1E96B0; --c2:#D4753C; --c3:#8878C0; --c4:#72A043;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);
  font-size:15px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.015em}
:where(a){color:var(--thread)}
:focus-visible{outline:2px solid var(--thread);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.eyebrow{font-family:var(--f-display);font-size:10.5px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ── shell ───────────────────────────────────────────────────────────── */
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;padding-block:13px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-size:17px;font-weight:700}
.brand .sub{font-size:12px;color:var(--ink-3);display:block;font-family:var(--f-body);
  font-weight:400;letter-spacing:0}
.warp{width:22px;height:22px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12px;
  color:var(--ink-2);font-family:var(--f-body)}
.chip b{font-weight:600;color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.live{background:var(--allow)}
button.ghost{font:inherit;font-size:12px;color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer}
button.ghost:hover{color:var(--ink);border-color:var(--ink-3)}

/* ── layout ──────────────────────────────────────────────────────────── */
.layout{display:grid;grid-template-columns:238px 1fr;gap:26px;
  padding-block:24px 118px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr;gap:16px}}

nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);
  display:flex;flex-direction:column;gap:3px}
@media (max-width:860px){
  nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:8px;
    padding-bottom:6px;scrollbar-width:thin}
}
.rail .eyebrow{padding:0 10px 7px}
@media (max-width:860px){.rail .eyebrow{display:none}}
.problem{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;text-align:left;
  padding:9px 11px;border-radius:9px;border:1px solid transparent;background:none;
  cursor:pointer;font:inherit;color:var(--ink-2);width:100%}
.problem:hover{background:var(--surface-2)}
.problem[aria-current="true"]{background:var(--surface);border-color:var(--line);
  box-shadow:var(--shadow);color:var(--ink)}
.problem .n{grid-row:span 2;font-family:var(--f-mono);font-size:10px;color:var(--ink-3);
  padding-top:3px}
.problem[aria-current="true"] .n{color:var(--thread)}
.problem .t{font-weight:600;font-size:14px;line-height:1.3}
.problem .d{font-size:11.5px;color:var(--ink-3);line-height:1.35}
@media (max-width:860px){
  .problem{grid-template-columns:auto;white-space:nowrap;width:auto}
  .problem .d,.problem .n{display:none}
}

/* ── panes ───────────────────────────────────────────────────────────── */
.pane[hidden]{display:none!important}
.pane>header{margin-bottom:18px}
.pane h2{font-size:24px;font-weight:700;margin-bottom:5px}
.pane .lede{color:var(--ink-2);max-width:63ch;font-size:14.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 17px}
.grid{display:grid;gap:14px}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.cols-2,.cols-3,.cols-4{grid-template-columns:1fr}}

/* status pills — semantic, separate from the accent */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;
  padding:2px 9px;font-size:11px;font-weight:600;font-family:var(--f-display);
  letter-spacing:.03em;white-space:nowrap}
.pill.allow{background:var(--allow-bg);color:var(--allow)}
.pill.review{background:var(--review-bg);color:var(--review)}
.pill.block{background:var(--block-bg);color:var(--block)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.pill.thread{background:var(--thread-soft);color:var(--thread)}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.board{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:9px;min-width:0}
.col>.eyebrow{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.col .count{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.art{background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:11px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.art .h{font-weight:600;font-size:13.5px;line-height:1.35;overflow-wrap:anywhere}
.art .m{font-size:11px;color:var(--ink-3);font-family:var(--f-mono);
  display:flex;gap:8px;flex-wrap:wrap}
.acts{display:flex;gap:5px;flex-wrap:wrap}
.act{font:inherit;font-size:11.5px;font-weight:600;font-family:var(--f-display);
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);
  border-radius:6px;padding:3px 8px;cursor:pointer}
.act:hover{border-color:var(--thread);color:var(--thread)}
.act.primary{background:var(--thread);border-color:var(--thread);color:#fff}
:root[data-theme="dark"] .act.primary,
:root:not([data-theme="light"]) .act.primary{color:#08191E}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .act.primary{color:#fff}}
.act.primary:hover{filter:brightness(1.08);color:#fff}
:root[data-theme="dark"] .act.primary:hover{color:#08191E}

/* ask */
.askrow{display:flex;gap:9px;flex-wrap:wrap}
input[type=text],textarea{font:inherit;font-family:var(--f-body);background:var(--surface);
  color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 11px;
  flex:1 1 260px;min-width:0}
textarea{resize:vertical;min-height:74px;width:100%}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
.src{border-left:2px solid var(--line);padding-left:11px;display:flex;
  flex-direction:column;gap:2px}
.src .f{font-family:var(--f-mono);font-size:11.5px;color:var(--thread)}
.src .x{font-size:13px;color:var(--ink-2);font-style:italic}

/* figures */
.tile{display:flex;flex-direction:column;gap:3px}
.tile .v{font-family:var(--f-display);font-size:27px;font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1.1}
.tile .k{font-size:11.5px;color:var(--ink-3)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:132px 1fr auto;gap:10px;align-items:center}
@media (max-width:560px){.bar{grid-template-columns:1fr;gap:3px}}
.bar .lab{font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
.bar .track{height:9px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;border-radius:5px}
.bar .val{font-family:var(--f-mono);font-size:12px;color:var(--ink);
  font-variant-numeric:tabular-nums}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:9px;height:9px;border-radius:2px;flex:none}

table{width:100%;border-collapse:collapse;font-size:13px}
.scroll{overflow-x:auto}
th{text-align:left;font-family:var(--f-display);font-size:10.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  padding:0 10px 7px 0;white-space:nowrap}
td{padding:8px 10px 8px 0;border-top:1px solid var(--line);vertical-align:top}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.note{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.note b{color:var(--ink-2);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-family:var(--f-mono);overflow-wrap:anywhere}

/* ── the gate strip ──────────────────────────────────────────────────── */
.gate{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -10px 30px -22px rgba(0,0,0,.6)}
.gate-in{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;
  padding-block:12px}
@media (max-width:860px){.gate-in{grid-template-columns:1fr;gap:11px}}
.gate.idle .staged{display:none}
.gate:not(.idle) .resting{display:none}
.resting{grid-column:1/-1;display:flex;align-items:center;gap:9px;
  font-size:12.5px;color:var(--ink-3)}
.threads{display:flex;align-items:flex-end;gap:5px;height:44px}
.thr{width:9px;border-radius:3px;background:var(--thread);position:relative}
.thr.undef{background:repeating-linear-gradient(180deg,var(--ink-3) 0 2px,transparent 2px 5px);
  opacity:.5}
.gate-why{min-width:0}
.gate-why .t{font-family:var(--f-display);font-weight:600;font-size:14px}
.gate-why .s{font-size:12.5px;color:var(--ink-2)}
.gate-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-family:var(--f-display);font-weight:600;font-size:13px;
  border-radius:8px;padding:8px 15px;cursor:pointer;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink-2)}
.btn:hover{color:var(--ink)}
.btn.go{background:var(--thread);border-color:var(--thread);color:#fff}
:root[data-theme="dark"] .btn.go{color:#08191E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.go{color:#08191E}}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sig{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--ink-3);
  font-family:var(--f-mono);margin-top:5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 104px);z-index:60;
  background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:999px;
  font-size:13px;font-weight:600;font-family:var(--f-display);box-shadow:var(--shadow)}
.toast[hidden]{display:none}
</style>

<header class="top">
  <div class="wrap topbar">
    <div class="brand">
      <svg class="warp" viewBox="0 0 22 22" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" style="color:var(--thread)">
          <path d="M3 4v14M8.3 4v14M13.6 4v14M19 4v14"/>
        </g>
        <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" style="color:var(--ink-3)">
          <path d="M2 8.5h18M2 13.5h18"/>
        </g>
      </svg>
      <div>
        <h1>Weave Operations Console</h1>
        <span class="sub">Every consequential action passes the gate</span>
      </div>
    </div>
    <span class="chip" id="modechip"><span class="dot" id="modedot"></span><b id="modetext">Example data</b></span>
    <button class="ghost" id="themebtn" type="button">Theme</button>
  </div>
</header>

<div class="wrap layout">
  <nav class="rail" id="rail" aria-label="What do you need to do?">
    <div class="eyebrow">What do you need to do?</div>
  </nav>
  <main id="main"></main>
</div>

<div class="gate idle" id="gate" role="region" aria-label="Execution gate">
  <div class="wrap gate-in">
    <div class="resting">
      <span class="dot"></span>
      <span>Gate idle — nothing staged. Consequential actions are proposed here first, scored, and committed separately.</span>
    </div>
    <div class="staged threads" id="threads" aria-hidden="true"></div>
    <div class="staged gate-why">
      <div class="t" id="gtitle"></div>
      <div class="s" id="gsub"></div>
      <div class="sig" id="gsig"></div>
    </div>
    <div class="staged gate-act">
      <span class="pill" id="gpill"></span>
      <button class="btn" type="button" id="gcancel">Discard</button>
      <button class="btn go" type="button" id="gcommit">Commit</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ────────────────────────────────────────────────────────────────────────
   Weave Operations Console

   Organised by problem, not by service. Each workbench is one thing an
   operator actually needs to get done; the services underneath are an
   implementation detail and are named only where knowing them helps.

   DATA. Two sources, and the page always says which one it is showing:
     • window.WEAVE_CONFIG present -> live mode, fetch from the deployed
       APIs. Set it by pasting the output of `python e2e/platform_env.py`.
     • absent -> example data, labelled as such in the header and never
       presented as the operator's own figures.
   A published Artifact is always the second: its CSP blocks every fetch
   to an outside host, so the page cannot reach API Gateway from
   claude.ai. Deploy this file behind the same origin (or a CORS-enabled
   one) and live mode turns itself on.

   THE GATE. Consequential actions are not executed on click. They are
   proposed, scored against the six-signal risk vector, and committed
   separately — the same propose/commit split mcp-observatory enforces on
   tool calls. signals_defined matters as much as the score: a low
   composite from one signal is not the evidence a low composite from six
   is, and the strip draws the undefined ones as slack threads so you can
   see how much of the vector actually informed the verdict.
   ──────────────────────────────────────────────────────────────────── */

const CFG = window.WEAVE_CONFIG || null;
const LIVE = !!(CFG && CFG.services);

/* Statuses and actions are the content orchestrator's real lifecycle. */
const FLOW = ["DRAFT","AWAITING_APPROVAL","APPROVED","PUBLISHED"];
const CTAS = {
  DRAFT:["generate","submit-for-approval","request-edits","reject"],
  REVISION_REQUESTED:["submit-for-approval","reject"],
  AWAITING_APPROVAL:["approve","request-edits","reject"],
  APPROVED:["mark-published","archive"],
  PUBLISHED:["archive"], FAILED:["submit-for-approval","archive"], ARCHIVED:[]
};
const CONSEQUENTIAL = new Set(["approve","mark-published","reject","archive","generate"]);

/* Example data. Plainly example — see the header chip. */
const DEMO = {
  articles:[
    {id:"a7f21c",title:"Why a shared telemetry table is not a shared contract",status:"AWAITING_APPROVAL",updatedAt:"2026-09-14T22:10Z",words:1180},
    {id:"b3d908",title:"Thompson sampling beat our argmax router by 31% regret",status:"AWAITING_APPROVAL",updatedAt:"2026-09-14T18:02Z",words:1440},
    {id:"c1a4e7",title:"Propose, then commit: bounded execution for tool calls",status:"APPROVED",updatedAt:"2026-09-13T09:41Z",words:1610},
    {id:"d90b12",title:"What a stale EngineVersion pin costs you",status:"DRAFT",updatedAt:"2026-09-15T04:55Z",words:320},
    {id:"e55f30",title:"Governance-first AI: the audit nobody ran",status:"PUBLISHED",updatedAt:"2026-09-08T11:00Z",words:1290},
    {id:"f2c881",title:"Six writers, one table, four key schemes",status:"PUBLISHED",updatedAt:"2026-09-01T11:00Z",words:990}
  ],
  spend:[
    {op:"invoke_model",usd:41.82,calls:2140,c:"--c1"},
    {op:"invoke_agent",usd:23.17,calls:604,c:"--c2"},
    {op:"synthesize_answer",usd:9.44,calls:1310,c:"--c3"},
    {op:"classify_question",usd:1.06,calls:1310,c:"--c4"}
  ],
  decisions:{ALLOW:3982,REVIEW:341,BLOCK:47},
  router:[
    {qt:"skill_depth",verdict:"converged",leader:"graph_first",pBest:.97,rated:34,mad:.19},
    {qt:"architecture",verdict:"learning",leader:"graph_first",pBest:.61,rated:12,mad:.24},
    {qt:"comparison",verdict:"learning",leader:"hybrid",pBest:.55,rated:7,mad:.31},
    {qt:"project",verdict:"starved",leader:"keyword_boosted",pBest:.88,rated:0,mad:null},
    {qt:"general",verdict:"converged",leader:"semantic_search",pBest:.93,rated:21,mad:.12}
  ],
  runs:[
    {id:"run-9f21c8",team:"visibility",status:"SUCCEEDED",started:"2026-09-15T04:12Z",secs:184},
    {id:"run-7b0ad4",team:"improvement",status:"SUCCEEDED",started:"2026-09-15T03:00Z",secs:96},
    {id:"run-2c55e1",team:"visibility",status:"FAILED",started:"2026-09-14T22:40Z",secs:211,
     error:"step 3 output failed schema validation: missing 'hook'"},
    {id:"run-e18b77",team:"visibility",status:"RUNNING",started:"2026-09-15T05:31Z",secs:null}
  ],
  answer:{
    answer:"The routing graph learns from two independent rewards. The model's own confidence in an answer is folded into the selected strategy's Beta posterior as a fractional Bernoulli reward, but only when the model actually reported one — a fallback constant the code chose is not an observation, and those are dropped. A human rating arriving later on the same queryId counts for twice as much.",
    sources:[
      {file:"CLAUDE.md",excerpt:"Only reported confidences are rewards.",weight:1.0},
      {file:"docs/confidence-semantics.md",excerpt:"states what every score means and when they may be combined",weight:1.0},
      {file:"src/query_api/rag_router.py",excerpt:"alpha += c; beta += 1 - c",weight:0.6}
    ],
    confidence:.84, confidenceReported:true, questionType:"skill_depth",
    strategy:"graph_first", propensity:.31, cacheHit:false, latencyMs:1840
  }
};

/* ── the risk vector ─────────────────────────────────────────────────── */
const SIGNALS = ["grounding_risk","self_consistency_risk","numeric_instability_risk",
                 "tool_mismatch_risk","drift_risk","verifier_risk"];

/* Deterministic per action so the same proposal scores the same twice —
   a gate whose verdict wanders on re-open teaches nobody anything. */
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0)/4294967296}

function scoreProposal(kind, subject){
  const seed = kind+"|"+subject;
  const v = {};
  // Signals only defined where the action's evidence supports them. A write
  // with no model output has no grounding or self-consistency to measure.
  const defines = {
    approve:["grounding_risk","self_consistency_risk","verifier_risk","drift_risk"],
    "mark-published":["verifier_risk","drift_risk"],
    reject:["verifier_risk"],
    archive:["verifier_risk"],
    generate:["grounding_risk","self_consistency_risk","numeric_instability_risk",
              "tool_mismatch_risk","drift_risk","verifier_risk"],
    policy:["grounding_risk","self_consistency_risk","tool_mismatch_risk","verifier_risk"],
    rate:["verifier_risk"]
  }[kind] || ["verifier_risk"];
  SIGNALS.forEach((s,i)=>{ v[s] = defines.includes(s) ? +(hash(seed+s+i)*0.62).toFixed(3) : null; });
  const present = SIGNALS.filter(s=>v[s]!==null);
  const composite = +(present.reduce((a,s)=>a+v[s],0)/present.length).toFixed(3);
  const level = composite>=.55?"high":composite>=.25?"medium":"low";
  // Thin evidence cannot clear a consequential action, however low it scores.
  const thin = present.length<3 && CONSEQUENTIAL.has(kind);
  const decision = level==="high"||thin ? (level==="high"?"BLOCK":"REVIEW")
                 : level==="medium" ? "REVIEW" : "ALLOW";
  return {vector:v, signals_defined:present.length, composite, level, decision, thin};
}

/* ── formatting ──────────────────────────────────────────────────────── */
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = n => "$"+n.toFixed(2);
const pct = n => Math.round(n*100)+"%";
const when = s => s ? s.replace("T"," ").replace("Z"," UTC") : "—";
const title = s => s.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());

<script>

function stage(proposal){

    const v = s.vector[name];

    const h = Math.max(7, Math.round(v/0.62*44));

  }).join("");
  document.getElementById("gtitle").textContent = proposal.title;
  document.getElementById("gsub").innerHTML =
    `Composite <b class="mono">${s.composite.toFixed(3)}</b> · ${s.level} · ` +
    `<b class="mono">${s.signals_defined} of 6</b> signals informed it` +
    (s.thin ? ` — <b>held for review on thin evidence</b>` : "");
  document.getElementById("gsig").innerHTML = SIGNALS.map(n=>{
    const v=s.vector[n]; return `${n.replace(/_risk$/,"")} ${v===null?"—":v.toFixed(2)}`;

document.getElementById("gcommit").onclick = ()=>{

};

<script>
"use strict";
/* ── Claude, for the two genuinely generative jobs ───────────────────── */
let sampler = null, samplerTried = false;
async function getSampler(){
  if(samplerTried) return sampler;
  samplerTried = true;
  try { sampler = (await window.claude?.use?.("sample")) || null; } catch { sampler = null; }
  return sampler;
}

/* ── wiring, rebound after every render ──────────────────────────────── */
function wire(){
  // Article actions. Consequential ones are proposed, not executed.
  main.querySelectorAll("[data-act]").forEach(b=>{
    b.onclick = ()=>{
      const {act, id} = b.dataset;
      const art = state.articles.find(a=>a.id===id);
      if(!art) return;
      if(!CONSEQUENTIAL.has(act)){ applyArticle(art, act); return; }
      stage({
        title:`${act.replace(/-/g," ")} — “${art.title}”`,
        score:scoreProposal(act, art.id),
        commit(){ applyArticle(art, act); }
      });
    };
  });

  // Ask
  const askform = main.querySelector("#askform");
  if(askform) askform.onsubmit = async e=>{
    e.preventDefault();
    const q = main.querySelector("#q").value.trim();
    if(!q) return;
    const btn = main.querySelector("#askbtn");
    btn.disabled = true; btn.textContent = "Asking…";
    state.answer = await ask(q);
    render();
  };
  main.querySelectorAll("[data-rate]").forEach(b=>{
    b.onclick = ()=>{
      const {rate, qid} = b.dataset;
      stage({
        title:`rate this answer “${rate}”`,
        score:scoreProposal("rate", qid),
        commit(){
          state.rated[qid] = rate;
          toast(rate==="up"?"Rated useful — folded into the router":"Rated — folded into the router");
          render();
        }
      });
    };
  });

  // Rule
  const ruleform = main.querySelector("#ruleform");
  if(ruleform) ruleform.onsubmit = async e=>{
    e.preventDefault();
    const q = main.querySelector("#ruletext").value.trim();
    if(!q) return;
    const btn = main.querySelector("#rulebtn");
    btn.disabled = true; btn.textContent = "Compiling…";
    state.rule = await compileRule(q);
    render();
  };
  const apply = main.querySelector("#applyrule");
  if(apply) apply.onclick = ()=>{
    stage({
      title:`apply rule to ${state.rule.device_type}`,
      score:scoreProposal("policy", state.rule.condition),
      commit(){ toast("Rule applied — active on next evaluation"); }
    });
  };
}

function applyArticle(art, act){
  const next = {approve:"APPROVED","mark-published":"PUBLISHED",
                "submit-for-approval":"AWAITING_APPROVAL","request-edits":"REVISION_REQUESTED",
                reject:"FAILED", archive:"ARCHIVED"}[act];
  if(act==="generate"){ toast("Generation queued — the article is unchanged until it returns"); return; }
  if(next){
    art.status = next;
    art.updatedAt = new Date().toISOString().slice(0,16)+"Z";
    toast(act==="approve" ? "Approved and written to S3" : `Moved to ${title(next)}`);
  }
  render();
}

/* Ask: live ContextWeave when configured, else Claude — labelled either way. */
async function ask(q){
  const qid = "q-" + Math.random().toString(36).slice(2,8);
  if(LIVE && CFG.services.contextweave?.api_base){
    try{
      const r = await fetch(CFG.services.contextweave.api_base + "/query-expertise", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({question:q})
      });
      if(r.ok){ const d = await r.json(); return {...d, q, qid:d.queryId||qid}; }
    }catch{ /* fall through to Claude, and say so */ }
  }
  const s = await getSampler();
  if(!s) return {...DEMO.answer, q, qid, source:"example"};
  try{
    const out = await s.json(
      `You are standing in for a GraphRAG knowledge layer over a governed AI platform
       (services: a gate that scores tool calls on a six-signal risk vector, a knowledge
       layer with a Thompson-sampling retrieval router, a Step Functions orchestrator, a
       content pipeline, a device-control surface).
       Answer this operator question in 2-4 sentences, concretely.
       Question: ${q}
       Return JSON: {"answer": string, "sources": [{"file": string, "excerpt": string,
       "weight": number}], "confidence": number, "questionType": one of
       "skill_depth"|"architecture"|"comparison"|"project"|"credential"|"general",
       "strategy": one of "graph_first"|"hybrid"|"keyword_boosted"|"semantic_search"}`,
      {modelTier:"default"});
    return {answer:out.answer, sources:out.sources||[], confidence:out.confidence??0.7,
            confidenceReported:true, questionType:out.questionType||"general",
            strategy:out.strategy||"semantic_search", propensity:0.25,
            q, qid, source:"claude"};
  }catch{ return {...DEMO.answer, q, qid, source:"example"}; }
}

/* Compile: the LLM proposes, a deterministic check decides. */
async function compileRule(q){
  const s = await getSampler();
  if(!s) return {q, device_type:"light", condition:"presence.is_home == false AND time.after('sunset')",
                 action:"BLOCK", confidence:0.81};
  try{
    const out = await s.json(
      `Compile this home-automation rule into a strict policy DSL.
       Rule: ${q}
       Return JSON: {"device_type": string, "condition": string, "action": one of
       "ALLOW"|"BLOCK"|"MODIFY", "confidence": number between 0 and 1}
       Use only field paths from: device.*, presence.is_home, time.*, weather.*.
       If the rule is too vague to compile deterministically, set confidence below 0.5.`,
      {modelTier:"default"});
    const c = Number(out.confidence);
    // The validator, not the compiler, decides. Below threshold is a 422.
    if(!out.condition || !out.action || !(c>=0.5)){
      return {q, rejected:true, why:`The compiler returned confidence ${isFinite(c)?c.toFixed(2):"none"}, `+
        `below the 0.50 floor. A rule that cannot be compiled deterministically is refused rather than guessed at.`};
    }
    return {q, device_type:out.device_type||"unknown", condition:out.condition,
            action:out.action, confidence:c};
  }catch{
    return {q, rejected:true, why:"The compiler could not be reached. That is a 502 — infrastructure, not the rule. Retrying is reasonable."};
  }
}

/* ── mode chip, theme, boot ──────────────────────────────────────────── */
(function boot(){
  const dot = document.getElementById("modedot");
  const txt = document.getElementById("modetext");
  const chip = document.getElementById("modechip");
  if(LIVE){
    dot.classList.add("live");
    txt.textContent = "Live";
    chip.title = "Reading the deployed stacks named in window.WEAVE_CONFIG";
  }else{
    txt.textContent = "Example data";
    chip.title = "Figures below are examples, not your platform's. "+
      "Set window.WEAVE_CONFIG from `python e2e/platform_env.py` to read the real stacks.";
  }

  const btn = document.getElementById("themebtn");
  let forced = null;
  try{ forced = localStorage.getItem("weave-theme"); }catch{}
  if(forced) document.documentElement.setAttribute("data-theme", forced);
  btn.onclick = ()=>{
    const now = document.documentElement.getAttribute("data-theme");
    const next = now==="dark" ? "light" : now==="light" ? null : "dark";
    if(next) document.documentElement.setAttribute("data-theme", next);
    else document.documentElement.removeAttribute("data-theme");
    try{ next ? localStorage.setItem("weave-theme",next) : localStorage.removeItem("weave-theme"); }catch{}
  };

  render();
})();
</script>
