[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-observatory"
version = "0.4.0"
description = "Observability and APM toolkit for MCP servers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "MCP Observatory Contributors" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "asyncpg>=0.29.0",
]

[project.optional-dependencies]
openai = [
  "openai>=1.40.0",
]
aws = [
  "boto3>=1.34.0",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mcp_observatory*"]

[tool.pytest.ini_options]
# `pytest` with no arguments runs the unit suite only. e2e/ talks to deployed
# stacks and is opt-in: `pytest e2e/` or `./e2e/run_e2e.sh`.
#
# This is a safety boundary, not tidiness. The publish workflow assumes an AWS
# role, so a bare `pytest` in a job that has credentials would otherwise collect
# the live suite and run it against production.
testpaths = ["tests"]
